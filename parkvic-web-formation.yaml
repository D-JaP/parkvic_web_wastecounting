AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  # CognitoClientID:
  #   Type: String
  #   Description: 'Cognito Client ID'
  #   Default: '572aocggegc3gkbeuba7mr16qv'
  UserPoolSecret: #need update if stack is firstly created
    Type: String
    Description: 'Cognito Client Secret'
    Default: '1tafbsgc2o0c2vf1hrpnn4co5f726kcid6g0quh81dhjlngoftdg'
  UserPoolDomain:
    Type: String
    Description: 'Cognito User Pool Domain'
    Default: 'parkvic'
Resources:
  # ParkVicWebBucket:
  #   Type: 'AWS::S3::Bucket'
  #   Properties:
  #     BucketName: 'parkvic-app'
  #     AccessControl: 'PublicRead'
  #     WebsiteConfiguration:
  #       IndexDocument: 'index.html'
  # BucketPolicy:
  #   Type: 'AWS::S3::BucketPolicy'
  #   Properties:
  #     Bucket: !Ref ParkVicWebBucket
  #     PolicyDocument:
  #       Statement:
  #         - Sid: "allow-ee-access"
  #           Effect: "Allow"
  #           Principal: "*"
  #           Action:
  #             - "s3:GetObject"
  #             - "s3:ListBucket"
  #           Resource:
  #             - "arn:aws:s3:::parkvic-app.harry-playground.click/*"
  #             - "arn:aws:s3:::parkvic-app.harry-playground.click"
  #         - Sid: "allow-public-write-lambda"
