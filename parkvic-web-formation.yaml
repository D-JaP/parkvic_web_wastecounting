      PayloadFormatVersion: 2.0
      TimeoutInMillis: 30000
  AuthorizerIntegration:
    Type: 'AWS::ApiGatewayV2::Integration'
    Properties:
      ApiId: !Ref ParkvicRestApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Authorizer.Arn}/invocations"
      IntegrationMethod: POST
      PayloadFormatVersion: 1.0
      TimeoutInMillis: 30000
  LogoutLambdaFunctionIntegration:
    Type: 'AWS::ApiGatewayV2::Integration'
    Properties:
      ApiId: !Ref ParkvicRestApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LogoutLambdaFunction.Arn}/invocations"
      IntegrationMethod: POST
      PayloadFormatVersion: 2.0
      TimeoutInMillis: 30000
  PaymentIntentLambdaFunctionIntegration:
    Type: 'AWS::ApiGatewayV2::Integration'
    Properties:
      ApiId: !Ref ParkvicRestApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PaymentIntentLambdaFunction.Arn}/invocations"
      IntegrationMethod: POST
      PayloadFormatVersion: 2.0
      TimeoutInMillis: 30000
  PostSubcribeWebhookLambdaFunctionIntegration:
    Type: 'AWS::ApiGatewayV2::Integration'
    Properties:
      ApiId: !Ref ParkvicRestApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PostSubcribeWebhookLambdaFunction.Arn}/invocations"
      IntegrationMethod: POST
      PayloadFormatVersion: 2.0
      TimeoutInMillis: 30000
  PresignUrlLambdaFunctionIntegration:
    Type: 'AWS::ApiGatewayV2::Integration'
    Properties:
      ApiId: !Ref ParkvicRestApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PresignUrlLambdaFunction.Arn}/invocations"
      IntegrationMethod: POST
      PayloadFormatVersion: 2.0
      TimeoutInMillis: 30000
  RefreshLambdaFunctionIntegration:
    Type: 'AWS::ApiGatewayV2::Integration'
    Properties:
      ApiId: !Ref ParkvicRestApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RefreshLambdaFunction.Arn}/invocations"
      IntegrationMethod: POST
      PayloadFormatVersion: 2.0
      TimeoutInMillis: 30000
  ImageProcessLambdaFunctionIntegration:
    Type: 'AWS::ApiGatewayV2::Integration'
    Properties:
      ApiId: !Ref ParkvicRestApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ParkvicApiV2LambdaFunction.Arn}/invocations"
      IntegrationMethod: POST
      PayloadFormatVersion: 2.0
      TimeoutInMillis: 30000

  # Route
  ExchangeCodeForTokenLambdaFunctionRoute:
    Type: 'AWS::ApiGatewayV2::Route'
    Properties:
      ApiId: !Ref ParkvicRestApi
      RouteKey: "POST /api/v1/exchangecodefortoken"
      Target: !Sub "integrations/${ExchangeCodeForTokenLambdaFunctionIntegration}"
  AuthorizerRoute:
    Type: 'AWS::ApiGatewayV2::Route'
    Properties:
      ApiId: !Ref ParkvicRestApi
      RouteKey: "POST /api/v1/authorizer"
      AuthorizationType: None
      Target: !Sub "integrations/${AuthorizerIntegration}"
  LogoutLambdaFunctionRoute:
    Type: 'AWS::ApiGatewayV2::Route'
    Properties:
      ApiId: !Ref ParkvicRestApi
      RouteKey: "POST /logout"
      Target: !Sub "integrations/${LogoutLambdaFunctionIntegration}"
  PaymentIntentLambdaFunctionRoute:
    Type: 'AWS::ApiGatewayV2::Route'
    Properties:
      ApiId: !Ref ParkvicRestApi
      RouteKey: "POST /api/v1/payment-intent"
      Target: !Sub "integrations/${PaymentIntentLambdaFunctionIntegration}"
  PostSubcribeWebhookLambdaFunctionRoute:
    Type: 'AWS::ApiGatewayV2::Route'
    Properties:
      ApiId: !Ref ParkvicRestApi
      RouteKey: "POST /api/v1/stripe-web-hook"
      Target: !Sub "integrations/${PostSubcribeWebhookLambdaFunctionIntegration}"
  PresignUrlLambdaFunctionRoute:
    Type: 'AWS::ApiGatewayV2::Route'
    Properties:
      ApiId: !Ref ParkvicRestApi
      RouteKey: "POST /api/v1/presignurl"
      Target: !Sub "integrations/${PresignUrlLambdaFunctionIntegration}"
  RefreshLambdaFunctionRoute:
    Type: 'AWS::ApiGatewayV2::Route'
    Properties:
      ApiId: !Ref ParkvicRestApi
      RouteKey: "POST /api/v1/refreshtoken"
      Target: !Sub "integrations/${RefreshLambdaFunctionIntegration}"
  ImageProcessRoute:
    Type: 'AWS::ApiGatewayV2::Route'
    Properties:
      ApiId: !Ref ParkvicRestApi
      RouteKey: "POST /api/v1/imageprocess"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref LambdaAuthorizer
      Target: !Sub "integrations/${ImageProcessLambdaFunctionIntegration}"
  #  Dynamo Db table
  ParkvicUserTable:
    Type: 'AWS::DynamoDB::Table'
    Properties:
      TableName: 'ParkvicUser'
      AttributeDefinitions:
        - AttributeName: 'email'
          AttributeType: 'S'
      KeySchema:
        - AttributeName: 'email'
          KeyType: 'HASH'
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      DeletionProtectionEnabled: false
      TableClass: 'STANDARD'

  UnauthenticatedUserTable:
    Type: 'AWS::DynamoDB::Table'
    Properties:
      TableName: 'ParkvicUnauthenticatedUser'
      AttributeDefinitions:
        - AttributeName: 'ip'
          AttributeType: 'S'
      KeySchema:
        - AttributeName: 'ip'
          KeyType: 'HASH'
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      DeletionProtectionEnabled: false
      TableClass: 'STANDARD' 

  #Stage
  StageDev:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ParkvicRestApi
      AutoDeploy: false
      Description: "dev stage"
      StageName: deploy

  # deployment
  Deployment:
    Type: 'AWS::ApiGatewayV2::Deployment'
    DependsOn: 
      - ExchangeCodeForTokenLambdaFunctionRoute
      - AuthorizerRoute
      - LogoutLambdaFunctionRoute
      - PaymentIntentLambdaFunctionRoute
      - PostSubcribeWebhookLambdaFunctionRoute
      - PresignUrlLambdaFunctionRoute
      - RefreshLambdaFunctionRoute
      - ImageProcessRoute
      # - DomainNameMapping
    Properties:
      Description: set up deployment
      ApiId: !Ref ParkvicRestApi
      StageName: deploy

